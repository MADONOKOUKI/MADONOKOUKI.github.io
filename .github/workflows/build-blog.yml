name: Build blog

# Regenerate blog/ whenever a post (or the generator) changes on main, so a
# Markdown file added through the GitHub web UI publishes without a local build.
on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "scripts/build_blog.py"
      - "scripts/blog_layout.html"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build blog pages
        run: python3 scripts/build_blog.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog data/posts.json
          if git diff --cached --quiet; then
            echo "blog/ already up to date"
          else
            git commit -m "blog: rebuild generated pages"
            git push
          fi
